# publishDir = "docs"

baseURL = "https://qcrypt.net"
languageCode = "en"
title = "QCrypt Conference Website"

# Theme: github.com/IAQI/conference-theme, shared by the QCrypt, TQC and QIP
# websites (layouts, styles, schedule and accepted-papers templates, scripts).
# The version is pinned in go.mod / go.sum and downloaded at build time
# (Netlify needs Go for this: GO_VERSION in netlify.toml). Update it with
# `hugo mod get -u github.com/IAQI/conference-theme`.
# This site's own files in layouts/, assets/, i18n/ override the module's;
# this year's colours are in assets/style/theme-YEAR.scss.
[module]
  [[module.imports]]
    path = "github.com/IAQI/conference-theme"

# Params
enableEmoji = true
enableRobotsTXT = true
enableMissingTranslationPlaceholders = true

# Google Analytics are currently disabled, 
# using it would officially require a cookie banner at least in the EU, and we don't have one...
# it's probably better not to track people anyways.
# GoogleAnalytics = "G-221GMGECQ6"

[services]
  [services.googleAnalytics]
    id = "G-221GMGECQ6"

[params]
    title = "QCrypt Conference Website"
    date = "2026-01-01"
    currentYear = 2026
    description = "International Conference on Quantum Cryptography"
    images = ["/images/social-share.jpg"]
    email = "webmaster@qcrypt.net"
    keywords = "event, quantum cryptography, QCrypt"
    copyright = "We :heart: sheep"
    copyright_link = "https://github.com/IAQI/qcrypt-website"
    # cfpUrl = "/2024/call"
    # subscriptionUrl = ""
    appleTouchIcon = "/apple-touch-icon.png"
    favicon32 = "/favicon-32x32.png"
    favicon16 = "/favicon-16x16.png"
    manifest = "/manifest.json"
    safariPinnedTab = "/safari-pinned-tab.svg"

[params.2025]
  city = "Sanya, China"
  timeanddate_cityid = 33
  themeColor = "#083a7c" # same as --primary in assets/style/theme-2025.scss
  [params.2025.logos]
    jumbo = "/images/2025/QCrypt_2025_logo.png"
    header = "/images/2025/QCrypt_2025_logo2.png"
    banner = "/images/2025/banner_2025.jpg"

[params.2026]
  city = "Ottawa, Canada"
  timeanddate_cityid = 188
  themeColor = "#ac191c"
  [params.2026.logos]
    jumbo = "/images/2026/QCrypt2026-Logo.png"
    header = "/images/2026/QCrypt2026-Logo2.png"
    banner = "/images/2026/Ottawa-Banner.jpeg"

[params.logos]
    footer = "/images/logos/netlify-color-accent.svg"
    footer_link = "https://www.netlify.com"

[server]
  [[server.redirects]]
      from = "/"
      to = "/2026/"
      status = 302
      force = true 

