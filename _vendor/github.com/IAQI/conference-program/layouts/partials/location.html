{{/* Renders the room of a session. Called from schedule-session.html with an
     entry of data/locations-YEAR.yml: {key, label, description}. */}}
{{ if or .label .description }}
<div class="location">
	{{ with .label }}<div class="location-label">{{ . }}</div>{{ end }}
	{{ with .description }}<div class="location-description">{{ . }}</div>{{ end }}
</div>
{{ end }}
